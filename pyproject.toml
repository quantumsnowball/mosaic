[build-system]
requires = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic"
version = "0.5.0"
description = "mosaic - handle mosaic in video"
authors = [
    { name = "Quantum Snowball", email = "quantum.snowball@gmail.com" }
]
dependencies = [
    'torch',
    'torchvision',
    'opencv-python',
    'alive-progress',
    'textual',
    'textual-dev',
    "typer",
    "rich",
]
requires-python = ">=3.14.4"

[project.urls]
Homepage = "https://github.com/quantumsnowball/mosaic"

[project.scripts]
mosaic = "mosaic:app"

[tool.pyright]
venvPath = "./"
venv = ".venv"

[tool.ruff.lint]
# Q = flake8-quotes (surgical string fixing)
# I = isort (import sorting)
# F401 = unused imports
select = ["Q", "I", "F401"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "single"
multiline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
